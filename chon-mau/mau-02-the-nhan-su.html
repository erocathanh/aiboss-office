<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mẫu 02 · Lưới thẻ nhân sự — Quản lý phòng ban AI</title>
<style>
  :root{
    --navy-0:#0a1929;
    --navy-1:#0d2137;
    --navy-2:#102a43;
    --navy-3:#16385a;
    --vang:#c89425;
    --vang-sang:#f1c768;
    --kem:#faf7f0;
    --kem-mo:rgba(250,247,240,.62);
    --kem-rat-mo:rgba(250,247,240,.34);
    --vien:rgba(250,247,240,.10);
    --vien-vang:rgba(200,148,37,.42);
    --bong:0 18px 44px rgba(0,0,0,.42);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font);
    color:var(--kem);
    background:
      radial-gradient(1100px 620px at 12% -8%, rgba(200,148,37,.13), transparent 62%),
      radial-gradient(900px 560px at 96% 4%, rgba(22,56,90,.85), transparent 60%),
      linear-gradient(168deg, var(--navy-0) 0%, var(--navy-2) 58%, #0b1e33 100%);
    background-attachment:fixed;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Thanh tiêu đề ---------- */
  .thanh-dinh{
    position:sticky; top:0; z-index:30;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    background:linear-gradient(180deg, rgba(10,25,41,.94), rgba(10,25,41,.80));
    border-bottom:1px solid var(--vien);
    box-shadow:0 10px 30px rgba(0,0,0,.28);
  }
  .thanh-dinh::after{
    content:""; display:block; height:2px;
    background:linear-gradient(90deg,transparent,var(--vang) 18%,var(--vang-sang) 50%,var(--vang) 82%,transparent);
    opacity:.75;
  }
  .dinh-trong{
    max-width:1440px; margin:0 auto; padding:16px 26px 14px;
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  }
  .dau-hieu{
    width:46px; height:46px; flex:none; border-radius:13px;
    background:linear-gradient(145deg,var(--vang-sang),var(--vang) 55%,#8f6716);
    color:#0a1929; display:grid; place-items:center;
    font-weight:800; font-size:19px; letter-spacing:.5px;
    box-shadow:0 8px 20px rgba(200,148,37,.32), inset 0 1px 0 rgba(255,255,255,.45);
  }
  .khoi-ten h1{
    margin:0; font-size:19px; font-weight:700; letter-spacing:.2px;
  }
  .khoi-ten h1 .nhan{
    color:var(--vang-sang); font-weight:800;
  }
  .khoi-ten p{
    margin:3px 0 0; font-size:12.5px; color:var(--kem-mo); letter-spacing:.35px; text-transform:uppercase;
  }
  .chi-so{ margin-left:auto; display:flex; gap:10px; flex-wrap:wrap }
  .o-so{
    border:1px solid var(--vien); border-radius:12px; padding:8px 15px;
    background:linear-gradient(180deg, rgba(250,247,240,.055), rgba(250,247,240,.015));
    min-width:104px;
  }
  .o-so b{ display:block; font-size:22px; line-height:1.1; color:var(--vang-sang); font-variant-numeric:tabular-nums }
  .o-so span{ font-size:11px; color:var(--kem-mo); text-transform:uppercase; letter-spacing:.7px }

  /* ---------- Bộ lọc ---------- */
  .bo-loc{ max-width:1440px; margin:0 auto; padding:22px 26px 6px }
  .hang-nut{ display:flex; gap:9px; flex-wrap:wrap; align-items:center }
  .nut-phong{
    display:inline-flex; align-items:center; gap:8px;
    border:1px solid var(--vien); border-radius:999px;
    background:rgba(250,247,240,.035);
    color:var(--kem-mo); font-family:inherit; font-size:13px; font-weight:600;
    padding:8px 14px; cursor:pointer; transition:.18s ease;
    white-space:nowrap;
  }
  .nut-phong .bieu-tuong{ font-size:14px; filter:saturate(.9) }
  .nut-phong .dem{
    font-size:11px; font-variant-numeric:tabular-nums;
    background:rgba(250,247,240,.09); border-radius:999px; padding:2px 7px; color:var(--kem-rat-mo);
  }
  .nut-phong:hover{ color:var(--kem); border-color:var(--vien-vang); background:rgba(200,148,37,.09); transform:translateY(-1px) }
  .nut-phong.chon{
    color:#0a1929; border-color:transparent;
    background:linear-gradient(145deg,var(--vang-sang),var(--vang));
    box-shadow:0 8px 20px rgba(200,148,37,.28);
  }
  .nut-phong.chon .dem{ background:rgba(10,25,41,.20); color:rgba(10,25,41,.78) }

  .hang-tim{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-top:16px }
  .o-tim{ position:relative; flex:1 1 320px; max-width:440px }
  .o-tim input{
    width:100%; font-family:inherit; font-size:14px; color:var(--kem);
    background:rgba(10,25,41,.55); border:1px solid var(--vien); border-radius:11px;
    padding:11px 40px 11px 38px; outline:none; transition:.18s;
  }
  .o-tim input::placeholder{ color:var(--kem-rat-mo) }
  .o-tim input:focus{ border-color:var(--vien-vang); box-shadow:0 0 0 3px rgba(200,148,37,.13) }
  .o-tim .kinh{ position:absolute; left:13px; top:50%; transform:translateY(-50%); opacity:.5; font-size:14px }
  .o-tim .xoa{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    border:0; background:transparent; color:var(--kem-rat-mo); cursor:pointer;
    font-size:17px; line-height:1; padding:5px 8px; border-radius:8px;
  }
  .o-tim .xoa:hover{ color:var(--vang-sang); background:rgba(250,247,240,.06) }
  .ket-qua{ font-size:13px; color:var(--kem-mo); letter-spacing:.2px }
  .ket-qua b{ color:var(--vang-sang); font-size:15px; font-variant-numeric:tabular-nums }

  /* ---------- Lưới thẻ ---------- */
  .luoi{
    max-width:1440px; margin:0 auto; padding:20px 26px 60px;
    display:grid; gap:13px;
    grid-template-columns:repeat(auto-fill, minmax(248px, 1fr));
  }
  .the{
    position:relative; overflow:hidden;
    display:flex; gap:13px; align-items:center;
    padding:13px 14px;
    border:1px solid var(--vien); border-radius:14px;
    background:linear-gradient(150deg, rgba(250,247,240,.055), rgba(250,247,240,.012) 62%);
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .the::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:var(--mau-phong); opacity:.85;
  }
  .the:hover{
    transform:translateY(-3px);
    border-color:var(--vien-vang);
    background:linear-gradient(150deg, rgba(200,148,37,.11), rgba(250,247,240,.02) 62%);
    box-shadow:var(--bong);
  }
  .anh{
    width:50px; height:50px; flex:none; border-radius:13px;
    display:grid; place-items:center;
    font-weight:800; font-size:16px; letter-spacing:.4px; color:var(--kem);
    background:linear-gradient(145deg, var(--c1), var(--c2));
    border:1px solid rgba(250,247,240,.14);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 6px 14px rgba(0,0,0,.30);
    text-shadow:0 1px 2px rgba(0,0,0,.35);
  }
  .thong-tin{ min-width:0; flex:1 }
  .ten{
    margin:0; font-size:13.5px; font-weight:700; letter-spacing:.1px; color:var(--kem);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .dong-vai{ margin:5px 0 0; display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--kem-mo) }
  .cham{ width:6px; height:6px; border-radius:50%; background:var(--mau-phong); flex:none; box-shadow:0 0 8px var(--mau-phong) }
  .dong-phong{
    margin:4px 0 0; font-size:11px; color:var(--kem-rat-mo);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .an{ display:none !important }

  .trong{
    grid-column:1/-1; text-align:center; padding:56px 20px; color:var(--kem-rat-mo);
    border:1px dashed var(--vien); border-radius:16px;
  }
  .trong b{ display:block; color:var(--kem-mo); font-size:15px; margin-bottom:6px }

  .chan{
    max-width:1440px; margin:0 auto; padding:0 26px 40px;
    font-size:11.5px; color:var(--kem-rat-mo); letter-spacing:.3px;
    border-top:1px solid var(--vien); padding-top:16px;
  }

  @media (max-width:760px){
    .dinh-trong{ padding:14px 16px 12px; gap:12px }
    .chi-so{ margin-left:0; width:100% }
    .o-so{ flex:1; min-width:0 }
    .bo-loc,.luoi,.chan{ padding-left:16px; padding-right:16px }
    .luoi{ grid-template-columns:repeat(auto-fill, minmax(210px,1fr)) }
    .khoi-ten h1{ font-size:16px }
  }
</style>
</head>

/* Màu điểm nhấn theo phòng ban — tông trầm, hợp bảng màu navy/vàng */
const MAU_PHONG = {
  "ky-thuat":"#5b93b8",
  "ai-agent":"#8a79bd",
  "marketing":"#c98a55",
  "dao-tao":"#5fa892",
  "ban-hang":"#d9a83c",

  "dieu-hanh":"#93a2ba"
};

/* Bảng màu ảnh đại diện: 10 tông trầm, sinh theo tên (ổn định, không ngẫu nhiên) */
const TONG_MAU = [
  ["#274b6d","#16304a"], ["#3d5a80","#22364f"], ["#4a5d7e","#28344a"],
  ["#5b4a72","#33294a"], ["#7a5a3c","#432f1e"], ["#3f6b63","#22403c"],
  ["#6d4450","#3d2530"], ["#4b6540","#2a3a25"], ["#8a6a2e","#4b3a17"],
  ["#33526b","#1c2f3f"]
];
function bam(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i)) >>> 0; } return h; }

const tenPhong = {}, iconPhong = {};
DU_LIEU.phong_ban.forEach(p => { tenPhong[p.ma]=p.ten; iconPhong[p.ma]=p.icon; });

document.getElementById('soNhanSu').textContent = DU_LIEU.tong;
document.getElementById('soPhongBan').textContent = DU_LIEU.phong_ban.length;
document.getElementById('soTong').textContent = DU_LIEU.nhan_su.length;

/* --- Dãy nút lọc --- */
const hangNut = document.getElementById('hangNut');
function themNut(ma, icon, ten, dem, chon){
  const b = document.createElement('button');
  b.className = 'nut-phong' + (chon ? ' chon' : '');
  b.dataset.ma = ma;
  b.innerHTML = (icon ? '<span class="bieu-tuong">'+icon+'</span>' : '') +
                '<span>'+ten+'</span><span class="dem">'+dem+'</span>';
  hangNut.appendChild(b);
}
themNut('tat-ca','◆','Tất cả phòng ban', DU_LIEU.nhan_su.length, true);
DU_LIEU.phong_ban.forEach(p => themNut(p.ma, p.icon, p.ten, p.so_nhan_su, false));

/* --- Dựng lưới thẻ (dựng 1 lần, lọc bằng ẩn/hiện) --- */
const luoi = document.getElementById('luoi');
const cacThe = DU_LIEU.nhan_su.map(ns => {
  const t = TONG_MAU[bam(ns.ten) % TONG_MAU.length];
  const el = document.createElement('article');
  el.className = 'the';
  el.style.setProperty('--c1', t[0]);
  el.style.setProperty('--c2', t[1]);
  el.style.setProperty('--mau-phong', MAU_PHONG[ns.phong] || '#c89425');
  el.innerHTML =
    '<div class="anh">'+ns.viet_tat+'</div>' +
    '<div class="thong-tin">' +
      '<h3 class="ten" title="'+ns.ten+'">'+ns.ten+'</h3>' +
      '<p class="dong-vai"><span class="cham"></span>'+ns.vai+'</p>' +
      '<p class="dong-phong">'+(iconPhong[ns.phong]||'')+' '+(tenPhong[ns.phong]||ns.phong)+'</p>' +
    '</div>';
  luoi.appendChild(el);
  return { el, ten: ns.ten.toLowerCase(), vai: ns.vai.toLowerCase(), phong: ns.phong };
});

const oTrong = document.createElement('div');
oTrong.className = 'trong an';
oTrong.innerHTML = '<b>Không có nhân sự nào khớp</b>Thử đổi phòng ban hoặc xoá bớt từ khoá tìm kiếm.';
luoi.appendChild(oTrong);

/* --- Lọc --- */
let phongDangChon = 'tat-ca';
const oTim = document.getElementById('oTim');
const soHien = document.getElementById('soHien');
const chuLoc = document.getElementById('chuLoc');

function loc(){
  const tu = oTim.value.trim().toLowerCase();
  let dem = 0;
  for (const t of cacThe){
    const hop = (phongDangChon === 'tat-ca' || t.phong === phongDangChon) &&
                (tu === '' || t.ten.includes(tu) || t.vai.includes(tu));
    t.el.classList.toggle('an', !hop);
    if (hop) dem++;
  }
  soHien.textContent = dem;
  oTrong.classList.toggle('an', dem !== 0);
  const phan = [];
  if (phongDangChon !== 'tat-ca') phan.push('phòng “'+tenPhong[phongDangChon]+'”');
  if (tu !== '') phan.push('từ khoá “'+oTim.value.trim()+'”');
  chuLoc.textContent = phan.length ? ' · lọc theo ' + phan.join(' + ') : '';
}

hangNut.addEventListener('click', e => {
  const b = e.target.closest('.nut-phong'); if(!b) return;
  hangNut.querySelectorAll('.nut-phong').forEach(x => x.classList.toggle('chon', x === b));
  phongDangChon = b.dataset.ma;
  loc();
});
oTim.addEventListener('input', loc);
oTim.addEventListener('keydown', e => { if(e.key === 'Escape'){ oTim.value=''; loc(); } });
document.getElementById('nutXoa').addEventListener('click', () => { oTim.value=''; oTim.focus(); loc(); });

loc();
</script>
</body>
</html>
