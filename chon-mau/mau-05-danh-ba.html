<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mẫu 05 — Danh bạ nhân sự AI</title>
<style>
  :root{
    --navy-0:#0a1929;
    --navy-1:#0d2136;
    --navy-2:#102a43;
    --navy-3:#16344f;
    --vien:rgba(250,247,240,.10);
    --vien-2:rgba(250,247,240,.16);
    --vang:#c89425;
    --vang-sang:#f1c768;
    --kem:#faf7f0;
    --kem-mo:rgba(250,247,240,.62);
    --kem-mo-2:rgba(250,247,240,.40);
    --cao-de:60px;
    --cao-tim:72px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
    background:var(--navy-0);
    background-image:linear-gradient(175deg,#0a1929 0%,#102a43 55%,#0a1929 100%);
    background-attachment:fixed;
    color:var(--kem);
    -webkit-font-smoothing:antialiased;
    font-size:15px;
    line-height:1.45;
    padding-bottom:60px;
  }

  /* ================= Thanh tiêu đề ================= */
  .thanh-de{
    position:sticky;top:0;z-index:40;
    height:var(--cao-de);
    display:flex;align-items:center;gap:14px;
    padding:0 22px;
    background:rgba(10,25,41,.92);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--vien);
    box-shadow:0 1px 0 rgba(200,148,37,.18);
  }
  .dau-an{
    width:30px;height:30px;flex:none;border-radius:8px;
    background:linear-gradient(140deg,var(--vang-sang),var(--vang));
    color:#0a1929;font-weight:800;font-size:14px;
    display:flex;align-items:center;justify-content:center;
    letter-spacing:.5px;
  }
  .khoi-de{display:flex;flex-direction:column;line-height:1.15;min-width:0}
  .khoi-de b{font-size:15px;font-weight:650;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .khoi-de span{font-size:11.5px;color:var(--kem-mo-2);letter-spacing:.45px;text-transform:uppercase}
  .so-lieu{margin-left:auto;display:flex;gap:8px;flex:none}
  .vien-so{
    border:1px solid rgba(200,148,37,.35);
    background:rgba(200,148,37,.09);
    border-radius:999px;padding:5px 13px;
    font-size:12px;color:var(--kem-mo);white-space:nowrap;
  }
  .vien-so b{color:var(--vang-sang);font-size:13.5px;font-weight:700;margin-right:3px}

  /* ================= Thanh tìm kiếm dính ================= */
  .thanh-tim{
    position:sticky;top:var(--cao-de);z-index:35;
    height:var(--cao-tim);
    display:flex;align-items:center;gap:10px;
    padding:0 22px;
    background:rgba(13,33,54,.95);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--vien);
  }
  .hop-tim{position:relative;flex:1;max-width:560px}
  .hop-tim svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.45}
  #o-tim{
    width:100%;height:40px;
    padding:0 38px 0 38px;
    border-radius:10px;
    border:1px solid var(--vien-2);
    background:rgba(10,25,41,.75);
    color:var(--kem);font-size:14px;font-family:inherit;
    outline:none;transition:border-color .15s,box-shadow .15s;
  }
  #o-tim::placeholder{color:var(--kem-mo-2)}
  #o-tim:focus{border-color:rgba(200,148,37,.55);box-shadow:0 0 0 3px rgba(200,148,37,.13)}
  .xoa-tim{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:24px;height:24px;border-radius:50%;border:0;cursor:pointer;
    background:rgba(250,247,240,.10);color:var(--kem-mo);
    font-size:15px;line-height:1;display:none;
  }
  .xoa-tim:hover{background:rgba(200,148,37,.25);color:var(--kem)}
  .loc-phong{
    height:40px;border-radius:10px;
    border:1px solid var(--vien-2);
    background:rgba(10,25,41,.75);
    color:var(--kem);font-family:inherit;font-size:13.5px;
    padding:0 12px;outline:none;cursor:pointer;flex:none;
  }
  .loc-phong:focus{border-color:rgba(200,148,37,.55)}
  .loc-phong option{background:#102a43;color:#faf7f0}
  .dem-kq{font-size:12.5px;color:var(--kem-mo-2);white-space:nowrap;flex:none}
  .dem-kq b{color:var(--vang-sang);font-weight:700}

  /* ================= Danh bạ ================= */
  .khung{
    max-width:820px;margin:0 auto;padding:10px 62px 26px 22px;
    min-height:calc(100vh - var(--cao-de) - var(--cao-tim));
    background:rgba(250,247,240,.022);
    border-left:1px solid var(--vien);
    border-right:1px solid var(--vien);
  }
  .nhom-de{
    position:sticky;top:calc(var(--cao-de) + var(--cao-tim));z-index:20;
    display:flex;align-items:center;gap:10px;
    padding:7px 14px;margin:14px 0 4px;
    background:rgba(16,42,67,.96);
    backdrop-filter:blur(8px);
    border-left:3px solid var(--vang);
    border-radius:0 8px 8px 0;
    scroll-margin-top:calc(var(--cao-de) + var(--cao-tim) + 6px);
  }
  .nhom-de .chu{
    font-size:15px;font-weight:800;color:var(--vang-sang);
    letter-spacing:1.5px;min-width:16px;
  }
  .nhom-de .duong{flex:1;height:1px;background:linear-gradient(90deg,rgba(200,148,37,.35),transparent)}
  .nhom-de .dem{font-size:11.5px;color:var(--kem-mo-2);letter-spacing:.4px}

  .dong{
    display:flex;align-items:center;gap:13px;
    padding:9px 14px;
    border-bottom:1px solid rgba(250,247,240,.055);
    cursor:default;
    transition:background .12s;
  }
  .dong:hover{background:rgba(250,247,240,.045)}
  .dong:last-child{border-bottom:0}

  .tron{
    width:38px;height:38px;flex:none;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:750;letter-spacing:.4px;
    color:#0a1929;
    background:linear-gradient(145deg,#f1c768,#c89425);
    border:1px solid rgba(250,247,240,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
  }
  .dong[data-vai="Trưởng phòng"] .tron{
    background:linear-gradient(145deg,#faf7f0,#e2c98a);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 0 2px rgba(200,148,37,.35);
  }

  .giua{min-width:0;flex:1}
  .ten{
    font-size:14.5px;font-weight:600;letter-spacing:.1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .ten em{font-style:normal;background:rgba(241,199,104,.24);color:var(--vang-sang);border-radius:3px;padding:0 1px}
  .phu{display:flex;align-items:center;gap:8px;margin-top:2px}
  .vai{font-size:12.5px;color:var(--kem-mo);white-space:nowrap}
  .sao{color:var(--vang);font-size:11px;letter-spacing:1px}

  .nhan{
    flex:none;font-size:11px;letter-spacing:.2px;
    padding:3px 9px;border-radius:999px;
    border:1px solid;white-space:nowrap;
    display:flex;align-items:center;gap:5px;
  }
  .nhan .ic{font-size:11px;filter:saturate(.85)}

  .rong{
    text-align:center;padding:70px 20px;color:var(--kem-mo-2);
  }
  .rong b{display:block;font-size:16px;color:var(--kem-mo);margin-bottom:6px;font-weight:600}

  /* ================= Thanh chữ cái A-Z ================= */
  .rail{
    position:fixed;z-index:30;
    left:min(calc(50% + 396px), calc(100% - 42px));
    top:calc(var(--cao-de) + var(--cao-tim) + 14px);
    bottom:14px;
    width:30px;
    display:flex;flex-direction:column;justify-content:center;gap:1px;
    padding:8px 2px;
    background:rgba(10,25,41,.55);
    border:1px solid var(--vien);
    border-radius:999px;
    backdrop-filter:blur(6px);
  }
  .rail button{
    border:0;background:none;cursor:pointer;
    color:var(--kem-mo-2);
    font-size:10.5px;font-weight:700;font-family:inherit;
    line-height:1;padding:2px 0;border-radius:4px;
    transition:color .1s,background .1s,transform .1s;
  }
  .rail button:hover{color:#0a1929;background:var(--vang-sang);transform:scale(1.25)}
  .rail button.tat{opacity:.22;cursor:default}
  .rail button.tat:hover{color:var(--kem-mo-2);background:none;transform:none}

  .chan{
    max-width:820px;margin:26px auto 0;padding:14px 62px 0 22px;
    border-top:1px solid var(--vien);
    font-size:11.5px;color:var(--kem-mo-2);letter-spacing:.3px;
    display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }

  @media (max-width:720px){
    .so-lieu .vien-so:nth-child(2){display:none}
    .thanh-tim{flex-wrap:wrap;height:auto;padding:10px 16px;gap:8px}
    :root{--cao-tim:106px}
    .hop-tim{max-width:none;flex:1 1 100%}
    .khung,.chan{padding-left:14px;padding-right:46px}
    .khung{border-left:0;border-right:0}
    .rail{width:24px}
    .nhan{display:none}
  }
</style>
</head>

<header class="thanh-de">
  <div class="dau-an">ET</div>
  <div class="khoi-de">

  <select class="loc-phong" id="loc-phong" title="Lọc theo phòng ban"></select>
  <div class="dem-kq"><b id="dem">0</b> kết quả</div>
</div>

<main class="khung" id="danh-ba"></main>

<div class="chan">

  <span>Bản mẫu giao diện nội bộ · dữ liệu thật từ sổ nhân sự</span>
</div>

/* Màu nhận diện từng phòng ban — tông trầm, không chọi với navy/vàng */
const MAU_PHONG = {
  'ky-thuat':  '#6f9fc4',
  'ai-agent':  '#a293c6',
  'marketing': '#d99a6c',
  'dao-tao':   '#7fb59b',
  'ban-hang':  '#d4af4a',
  'studio':    '#c68b96',
  'dieu-hanh': '#93a7bb'
};

const PHONG = {};
DU_LIEU.phong_ban.forEach(p => PHONG[p.ma] = p);

const BANG_CHU = '#ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

function chuDau(ten){
  const s = ten.startsWith('claude-') ? ten.slice(7) : ten;
  const c = (s[0] || '#').toUpperCase();
  return /[A-Z]/.test(c) ? c : '#';
}

/* Chuẩn hoá tiếng Việt để tìm không dấu vẫn ra */
function bo_dau(s){
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\u0111/g,'d').replace(/\u0110/g,'D').toLowerCase();
}

const NHAN_SU = DU_LIEU.nhan_su.map(n => {
  const p = PHONG[n.phong] || {ten:n.phong, icon:'•'};
  return {
    ...n,
    phong_ten: p.ten,
    phong_icon: p.icon,
    chu: chuDau(n.ten),
    tim: bo_dau(n.ten + ' ' + n.vai + ' ' + p.ten + ' ' + n.viet_tat)
  };
}).sort((a,b) => {
  if (a.chu !== b.chu) return a.chu === '#' ? -1 : (b.chu === '#' ? 1 : a.chu.localeCompare(b.chu));
  return a.ten.localeCompare(b.ten, 'vi');
});

selPhong.innerHTML =
  '<option value="">Tất cả phòng ban</option>' +
  DU_LIEU.phong_ban.map(p => `<option value="${p.ma}">${p.icon} ${p.ten} (${p.so_nhan_su})</option>`).join('');

/* ---- Dựng thanh chữ cái ---- */
const rail = document.getElementById('rail');
rail.innerHTML = BANG_CHU.map(c => `<button data-chu="${c}" title="Nhảy tới nhóm ${c}">${c}</button>`).join('');
rail.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.classList.contains('tat')) return;
  const dich = document.getElementById('nhom-' + b.dataset.chu);
  if (dich) dich.scrollIntoView({behavior:'smooth', block:'start'});
});

/* ---- Tô sáng từ khoá trong tên ---- */
function tho(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function to_sang(ten, tu){
  const an = tho(ten);
  if (!tu) return an;
  const i = bo_dau(ten).indexOf(tu);
  if (i < 0) return an;
  return tho(ten.slice(0,i)) + '<em>' + tho(ten.slice(i, i+tu.length)) + '</em>' + tho(ten.slice(i+tu.length));
}

function dong_html(n, tu){
  const mau = MAU_PHONG[n.phong] || '#93a7bb';
  const truong = n.vai === 'Trưởng phòng';
  return `<div class="dong" data-vai="${n.vai}">
    <div class="tron">${tho(n.viet_tat)}</div>
    <div class="giua">
      <div class="ten">${to_sang(n.ten, tu)}</div>
      <div class="phu">
        ${truong ? '<span class="sao" title="Trưởng phòng">★</span>' : ''}
        <span class="vai">${tho(n.vai)}</span>
      </div>
    </div>
    <span class="nhan" style="color:${mau};border-color:${mau}44;background:${mau}18">
      <span class="ic">${n.phong_icon}</span>${tho(n.phong_ten)}
    </span>
  </div>`;
}

function ve(){
  const tu = bo_dau(oTim.value.trim());
  const pb = selPhong.value;
  nutXoa.style.display = oTim.value ? 'block' : 'none';

  const loc = NHAN_SU.filter(n => (!pb || n.phong === pb) && (!tu || n.tim.includes(tu)));
  document.getElementById('dem').textContent = loc.length;

  const co = new Set(loc.map(n => n.chu));
  rail.querySelectorAll('button').forEach(b => b.classList.toggle('tat', !co.has(b.dataset.chu)));

  if (!loc.length){
    bang.innerHTML = `<div class="rong"><b>Không tìm thấy nhân sự nào</b>Thử đổi từ khoá hoặc chọn lại phòng ban.</div>`;
    return;
  }

  let html = '', chuHienTai = null;
  const dem = {};
  loc.forEach(n => dem[n.chu] = (dem[n.chu] || 0) + 1);

  loc.forEach(n => {
    if (n.chu !== chuHienTai){
      chuHienTai = n.chu;
      html += `<div class="nhom-de" id="nhom-${chuHienTai}">
        <span class="chu">${chuHienTai}</span>
        <span class="duong"></span>
        <span class="dem">${dem[chuHienTai]} nhân sự</span>
      </div>`;
    }
    html += dong_html(n, tu);
  });
  bang.innerHTML = html;
}

oTim.addEventListener('input', ve);
selPhong.addEventListener('change', ve);
nutXoa.addEventListener('click', () => { oTim.value = ''; oTim.focus(); ve(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.activeElement === oTim){ oTim.value = ''; ve(); }
  if (e.key === '/' && document.activeElement !== oTim){ e.preventDefault(); oTim.focus(); }
});

ve();
</script>
</body>
</html>
