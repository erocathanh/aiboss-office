<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mẫu 03 — Bảng cột theo phòng · Quản lý phòng ban AI</title>
<style>
  :root{
    --navy-1:#0a1929;
    --navy-2:#102a43;
    --navy-3:#16354f;
    --vang:#c89425;
    --vang-sang:#f1c768;
    --kem:#faf7f0;
    --kem-mo:rgba(250,247,240,.62);
    --kem-rat-mo:rgba(250,247,240,.34);
    --vien:rgba(250,247,240,.10);
    --vien-manh:rgba(250,247,240,.20);
    --chu:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
    --ma:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:var(--chu);
    color:var(--kem);
    background:
      radial-gradient(1200px 600px at 12% -10%, rgba(200,148,37,.13), transparent 60%),
      linear-gradient(160deg,var(--navy-1) 0%, var(--navy-2) 62%, #0b2036 100%);
    background-attachment:fixed;
    display:flex;flex-direction:column;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== Thanh tiêu đề ===== */
  .thanh-tieu-de{
    flex:0 0 auto;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:14px 22px;
    background:linear-gradient(180deg, rgba(10,25,41,.96), rgba(10,25,41,.72));
    border-bottom:1px solid var(--vien-manh);
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    position:relative;z-index:5;
  }
  .dau-hieu{
    width:40px;height:40px;flex:0 0 auto;border-radius:11px;
    display:grid;place-items:center;
    background:linear-gradient(145deg,var(--vang-sang),var(--vang));
    color:#0a1929;font-weight:800;font-size:15px;letter-spacing:.5px;
    box-shadow:0 6px 18px rgba(200,148,37,.32);
  }
  .khoi-ten h1{
    margin:0;font-size:16px;font-weight:650;letter-spacing:.2px;
    display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
  }
  .khoi-ten h1 .ma-mau{
    font-family:var(--ma);font-size:11px;font-weight:600;
    color:var(--vang-sang);border:1px solid rgba(241,199,104,.4);
    padding:2px 7px;border-radius:6px;letter-spacing:.6px;
  }
  .khoi-ten p{margin:3px 0 0;font-size:12px;color:var(--kem-rat-mo)}
  .nhom-so{display:flex;gap:10px;margin-left:auto;align-items:center;flex-wrap:wrap}
  .the-so{
    display:flex;align-items:baseline;gap:7px;
    padding:7px 13px;border-radius:9px;
    background:rgba(250,247,240,.05);border:1px solid var(--vien);
  }
  .the-so b{font-size:17px;color:var(--vang-sang);font-weight:700;letter-spacing:.3px}
  .the-so span{font-size:11px;color:var(--kem-mo);text-transform:uppercase;letter-spacing:.9px}
  .o-tim{
    display:flex;align-items:center;gap:8px;
    padding:8px 12px;border-radius:9px;
    background:rgba(0,0,0,.25);border:1px solid var(--vien);
  }
  .o-tim input{
    background:transparent;border:0;outline:none;color:var(--kem);
    font-family:var(--chu);font-size:13px;width:150px;
  }
  .o-tim input::placeholder{color:var(--kem-rat-mo)}
  .nut{
    padding:8px 13px;border-radius:9px;cursor:pointer;
    background:rgba(200,148,37,.12);border:1px solid rgba(200,148,37,.45);
    color:var(--vang-sang);font-family:var(--chu);font-size:12px;font-weight:600;
    transition:background .18s,transform .12s;
  }
  .nut:hover{background:rgba(200,148,37,.24)}
  .nut:active{transform:translateY(1px)}

  /* ===== Dải chú thích ===== */
  .dai-chu-thich{
    flex:0 0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:8px 22px;font-size:11.5px;color:var(--kem-rat-mo);
    border-bottom:1px solid rgba(250,247,240,.06);
    background:rgba(0,0,0,.12);
  }
  .dai-chu-thich .keo{color:var(--vang-sang)}
  .cham-vai{display:inline-flex;align-items:center;gap:6px}
  .cham-vai i{width:8px;height:8px;border-radius:50%;display:inline-block}

  /* ===== Bảng cột ===== */
  .bang{
    flex:1 1 auto;min-height:0;
    display:flex;gap:16px;
    padding:16px 22px 20px;
    overflow-x:auto;overflow-y:hidden;
    scrollbar-width:thin;scrollbar-color:rgba(200,148,37,.5) transparent;
  }
  .bang::-webkit-scrollbar{height:11px}
  .bang::-webkit-scrollbar-track{background:rgba(0,0,0,.25);border-radius:99px}
  .bang::-webkit-scrollbar-thumb{background:rgba(200,148,37,.45);border-radius:99px}
  .bang::-webkit-scrollbar-thumb:hover{background:rgba(200,148,37,.7)}

  .cot{
    flex:0 0 292px;display:flex;flex-direction:column;min-height:0;
    background:linear-gradient(180deg, rgba(250,247,240,.055), rgba(250,247,240,.022));
    border:1px solid var(--vien);border-radius:15px;
    box-shadow:0 14px 34px rgba(0,0,0,.30);
    transition:border-color .18s, box-shadow .18s, background .18s;
  }
  .cot.dang-nhan{
    border-color:rgba(241,199,104,.7);
    background:linear-gradient(180deg, rgba(200,148,37,.16), rgba(200,148,37,.05));
    box-shadow:0 0 0 1px rgba(241,199,104,.35), 0 16px 40px rgba(0,0,0,.45);
  }
  .dau-cot{
    flex:0 0 auto;padding:13px 14px 11px;
    border-bottom:1px solid var(--vien);
    display:flex;align-items:center;gap:11px;
    border-radius:15px 15px 0 0;
    background:linear-gradient(180deg, rgba(10,25,41,.55), transparent);
  }
  .bieu-tuong{
    width:34px;height:34px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;
    font-size:17px;background:rgba(250,247,240,.07);border:1px solid var(--vien-manh);
  }
  .ten-phong{flex:1 1 auto;min-width:0}
  .ten-phong strong{
    display:block;font-size:13.5px;font-weight:650;letter-spacing:.15px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .ten-phong em{
    display:block;font-style:normal;font-family:var(--ma);
    font-size:10px;color:var(--kem-rat-mo);letter-spacing:.5px;margin-top:2px;
  }
  .so-luong{
    flex:0 0 auto;min-width:34px;text-align:center;
    padding:4px 9px;border-radius:8px;font-size:12.5px;font-weight:700;
    color:var(--vang-sang);background:rgba(200,148,37,.14);
    border:1px solid rgba(200,148,37,.35);font-variant-numeric:tabular-nums;
  }
  .than-cot{
    flex:1 1 auto;min-height:0;overflow-y:auto;
    padding:10px;display:flex;flex-direction:column;gap:8px;
    scrollbar-width:thin;scrollbar-color:rgba(250,247,240,.22) transparent;
  }
  .than-cot::-webkit-scrollbar{width:8px}
  .than-cot::-webkit-scrollbar-track{background:transparent}
  .than-cot::-webkit-scrollbar-thumb{background:rgba(250,247,240,.16);border-radius:99px}
  .than-cot::-webkit-scrollbar-thumb:hover{background:rgba(200,148,37,.5)}
  .rong{
    margin:auto;text-align:center;font-size:12px;color:var(--kem-rat-mo);
    padding:22px 10px;border:1px dashed var(--vien-manh);border-radius:11px;width:100%;
  }

  /* ===== Thẻ nhân sự ===== */
  .the{
    display:flex;align-items:center;gap:10px;
    padding:9px 10px;border-radius:11px;cursor:grab;
    background:linear-gradient(145deg, rgba(22,53,79,.92), rgba(16,42,67,.92));
    border:1px solid rgba(250,247,240,.09);
    box-shadow:0 3px 10px rgba(0,0,0,.28);
    transition:transform .14s, border-color .16s, box-shadow .16s, opacity .16s;
  }
  .the:hover{
    transform:translateY(-2px);
    border-color:rgba(241,199,104,.5);
    box-shadow:0 8px 20px rgba(0,0,0,.42);
  }
  .the:active{cursor:grabbing}
  .the.dang-keo{opacity:.32;filter:saturate(.4);transform:scale(.97)}
  .the.an{display:none}
  .anh-dai-dien{
    width:31px;height:31px;flex:0 0 auto;border-radius:9px;display:grid;place-items:center;
    font-size:11px;font-weight:800;letter-spacing:.4px;color:#0a1929;
    background:linear-gradient(145deg,var(--vang-sang),var(--vang));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
  }
  .the.vai-truong .anh-dai-dien{background:linear-gradient(145deg,#f7dd9a,#c89425)}
  .the.vai-kiem  .anh-dai-dien{background:linear-gradient(145deg,#dfe7ee,#9db3c6);color:#0a1929}
  .the.vai-thuc  .anh-dai-dien{background:linear-gradient(145deg,#cfd9e2,#7f97ad)}
  .the.vai-dung  .anh-dai-dien{background:linear-gradient(145deg,#e8d6ab,#a9884a)}
  .the.vai-van   .anh-dai-dien{background:linear-gradient(145deg,#c8d6c9,#7d967f)}
  .thong-tin{min-width:0;flex:1 1 auto}
  .thong-tin b{
    display:block;font-family:var(--ma);font-size:11.5px;font-weight:600;letter-spacing:-.1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--kem);
  }
  .thong-tin span{
    display:inline-block;margin-top:3px;font-size:10px;letter-spacing:.4px;
    color:var(--kem-mo);padding:1px 6px;border-radius:5px;
    background:rgba(250,247,240,.06);border:1px solid rgba(250,247,240,.09);
  }
  .the.vai-truong .thong-tin span{color:var(--vang-sang);border-color:rgba(200,148,37,.4);background:rgba(200,148,37,.12)}

  .cho-tha{
    height:3px;border-radius:99px;margin:1px 2px;
    background:linear-gradient(90deg,var(--vang),var(--vang-sang));
    box-shadow:0 0 10px rgba(241,199,104,.7);
  }

  /* ===== Thông báo ===== */
  .thong-bao{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
    padding:11px 18px;border-radius:11px;font-size:13px;
    background:rgba(10,25,41,.96);border:1px solid rgba(200,148,37,.55);
    color:var(--kem);box-shadow:0 14px 36px rgba(0,0,0,.5);
    opacity:0;pointer-events:none;transition:opacity .22s, transform .22s;z-index:40;
  }
  .thong-bao.hien{opacity:1;transform:translate(-50%,0)}
  .thong-bao b{color:var(--vang-sang);font-family:var(--ma);font-size:12px}

  @media (max-width:720px){
    .thanh-tieu-de{padding:12px 14px;gap:12px}
    .nhom-so{width:100%;margin-left:0}
    .o-tim input{width:100%}
    .bang{padding:12px 14px 16px;gap:12px}
    .cot{flex:0 0 84vw}
    .dai-chu-thich{padding:8px 14px}
  }
</style>
</head>
<body>

<header class="thanh-tieu-de">
  <div class="dau-hieu">ET</div>
  <div class="khoi-ten">
    <h1>Quản lý phòng ban AI <span class="ma-mau">MẪU 03 · BẢNG CỘT THEO PHÒNG</span></h1>
    <p>Bảng điều phối nhân sự AI — kéo thẻ để chuyển nhân sự sang phòng ban khác</p>
  </div>
  <div class="nhom-so">
    <div class="o-tim">
      <span aria-hidden="true">🔍</span>
      <input id="o-tim" type="search" placeholder="Tìm nhân sự…" aria-label="Tìm nhân sự theo tên">
    </div>
    <div class="the-so"><b id="tong-nhan-su">0</b><span>Nhân sự</span></div>
    <div class="the-so"><b id="tong-phong">0</b><span>Phòng ban</span></div>
    <button class="nut" id="nut-khoi-phuc" type="button">↺ Khôi phục ban đầu</button>
  </div>
</header>

<div class="dai-chu-thich">
  <span class="keo">✥ Kéo &amp; thả thẻ giữa các cột để điều chuyển</span>
  <span class="cham-vai"><i style="background:linear-gradient(145deg,#f7dd9a,#c89425)"></i> Trưởng phòng</span>
  <span class="cham-vai"><i style="background:linear-gradient(145deg,#dfe7ee,#9db3c6)"></i> Kiểm định</span>
  <span class="cham-vai"><i style="background:linear-gradient(145deg,#cfd9e2,#7f97ad)"></i> Thực thi</span>
  <span class="cham-vai"><i style="background:linear-gradient(145deg,#e8d6ab,#a9884a)"></i> Dựng hệ</span>
  <span class="cham-vai"><i style="background:linear-gradient(145deg,#c8d6c9,#7d967f)"></i> Vận hành</span>
  <span class="cham-vai"><i style="background:linear-gradient(145deg,#f1c768,#c89425)"></i> Chuyên viên</span>
</div>

<main class="bang" id="bang" aria-label="Bảng cột theo phòng ban"></main>

<div class="thong-bao" id="thong-bao" role="status" aria-live="polite"></div>

  el.dataset.ten = ns.ten;

  el.innerHTML =

    '<div class="thong-tin"><b>' + escapeHtml(ns.ten) + '</b><span>' + escapeHtml(ns.vai) + '</span></div>';

}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

    dau.className = 'dau-cot';
    dau.innerHTML =
      '<div class="bieu-tuong">' + pb.icon + '</div>' +
      '<div class="ten-phong"><strong>' + escapeHtml(pb.ten) + '</strong><em>' + escapeHtml(pb.ma) + '</em></div>' +
      '<div class="so-luong">0</div>';

    const than = document.createElement('div');
    than.className = 'than-cot';
    than.dataset.ma = pb.ma;

    DU_LIEU.nhan_su.filter(ns => ns.phong === pb.ma).forEach(ns => than.appendChild(taoThe(ns)));

    cot.appendChild(dau);
    cot.appendChild(than);
    bang.appendChild(cot);
  });
  capNhatSoLuong();
  locTheoTen(oTim.value);
}

function capNhatSoLuong(){
  bang.querySelectorAll('.cot').forEach(cot => {
    const than = cot.querySelector('.than-cot');
    const so = than.querySelectorAll('.the').length;
    cot.querySelector('.so-luong').textContent = so;
    const rong = than.querySelector('.rong');
    if(so === 0 && !rong){
      const p = document.createElement('div');
      p.className = 'rong';
      p.textContent = 'Chưa có nhân sự — thả thẻ vào đây';
      than.appendChild(p);
    }else if(so > 0 && rong){
      rong.remove();
    }
  });
}

/* ====== Kéo & thả ====== */
let theDangKeo = null;

bang.addEventListener('dragstart', e => {
  const the = e.target.closest('.the');
  if(!the) return;
  theDangKeo = the;
  the.classList.add('dang-keo');
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', the.dataset.ten); }catch(_){}
});

bang.addEventListener('dragend', () => {
  if(theDangKeo) theDangKeo.classList.remove('dang-keo');
  theDangKeo = null;
  bang.querySelectorAll('.cot.dang-nhan').forEach(c => c.classList.remove('dang-nhan'));
  xoaVachTha();
});

function xoaVachTha(){
  bang.querySelectorAll('.cho-tha').forEach(v => v.remove());
}

function timTheSauCon(than, y){
  const cacThe = [...than.querySelectorAll('.the:not(.dang-keo):not(.an)')];
  return cacThe.find(the => {
    const h = the.getBoundingClientRect();
    return y < h.top + h.height / 2;
  }) || null;
}

bang.addEventListener('dragover', e => {
  const than = e.target.closest('.than-cot');
  if(!than || !theDangKeo) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';

  bang.querySelectorAll('.cot.dang-nhan').forEach(c => c.classList.remove('dang-nhan'));
  than.closest('.cot').classList.add('dang-nhan');

  xoaVachTha();
  const vach = document.createElement('div');
  vach.className = 'cho-tha';
  const sau = timTheSauCon(than, e.clientY);
  if(sau) than.insertBefore(vach, sau); else than.appendChild(vach);
});

bang.addEventListener('dragleave', e => {
  const cot = e.target.closest('.cot');
  if(cot && !cot.contains(e.relatedTarget)) cot.classList.remove('dang-nhan');
});

bang.addEventListener('drop', e => {
  const than = e.target.closest('.than-cot');
  if(!than || !theDangKeo) return;
  e.preventDefault();

  const phongCu = theDangKeo.closest('.cot').dataset.ten;
  const vach = than.querySelector('.cho-tha');
  if(vach) than.insertBefore(theDangKeo, vach); else than.appendChild(theDangKeo);
  xoaVachTha();

  const phongMoi = than.closest('.cot').dataset.ten;
  theDangKeo.classList.remove('dang-keo');
  bang.querySelectorAll('.cot.dang-nhan').forEach(c => c.classList.remove('dang-nhan'));
  capNhatSoLuong();

  if(phongCu !== phongMoi){
    baoTin('Đã chuyển <b>' + escapeHtml(theDangKeo.dataset.ten) + '</b> sang “' + escapeHtml(phongMoi) + '”');
  }else{
    baoTin('Đã sắp xếp lại <b>' + escapeHtml(theDangKeo.dataset.ten) + '</b> trong “' + escapeHtml(phongMoi) + '”');
  }
  theDangKeo = null;
});

let hen = null;
function baoTin(html){
  hopThongBao.innerHTML = html;
  hopThongBao.classList.add('hien');
  clearTimeout(hen);
  hen = setTimeout(() => hopThongBao.classList.remove('hien'), 2600);
}

/* ====== Lọc theo tên ====== */
function locTheoTen(tu){
  const k = (tu || '').trim().toLowerCase();
  bang.querySelectorAll('.the').forEach(the => {
    const khop = !k || the.dataset.ten.toLowerCase().includes(k) || the.dataset.vai.toLowerCase().includes(k);
    the.classList.toggle('an', !khop);
  });
}
oTim.addEventListener('input', () => locTheoTen(oTim.value));

document.getElementById('nut-khoi-phuc').addEventListener('click', () => {
  dungBang();
  baoTin('Đã khôi phục sơ đồ ban đầu — <b>' + (DU_LIEU.tong ?? DU_LIEU.nhan_su.length) + '</b> nhân sự');
});

dungBang();
</script>
