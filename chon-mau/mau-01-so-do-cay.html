<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mẫu 01 — Sơ đồ cây · Quản lý phòng ban AI</title>
<style>
:root{
  --nen-1:#0a1929;
  --nen-2:#102a43;
  --nen-3:#0d2237;
  --vien:#1e3f5c;
  --duong-noi:#2b5273;
  --vang:#c89425;
  --vang-sang:#f1c768;
  --kem:#faf7f0;
  --chu-mo:#9cb3c7;
  --chu-rat-mo:#6f8aa3;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:
    radial-gradient(1100px 620px at 50% -8%, #16385a 0%, rgba(10,25,41,0) 62%),
    linear-gradient(180deg,#102a43 0%, #0a1929 55%, #0a1929 100%);
  background-attachment:fixed;
  color:var(--kem);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

/* ============ THANH TIÊU ĐỀ ============ */
.thanh-tieu-de{
  position:sticky; top:0; z-index:30;
  display:flex; flex-wrap:wrap; align-items:center; gap:18px;
  padding:14px 26px;
  background:linear-gradient(180deg, rgba(13,34,55,.96), rgba(10,25,41,.92));
  border-bottom:1px solid var(--vien);
  backdrop-filter:blur(10px);
}
.dau-hieu{
  width:42px;height:42px;flex:none;border-radius:11px;
  background:linear-gradient(145deg,var(--vang-sang),var(--vang));
  color:#0a1929; font-weight:800; font-size:18px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(200,148,37,.28);
  letter-spacing:-.5px;
}
.khoi-ten h1{
  margin:0; font-size:16px; font-weight:700; letter-spacing:.4px;
  text-transform:uppercase; color:var(--kem);
}
.khoi-ten p{
  margin:3px 0 0; font-size:12.5px; color:var(--vang-sang); letter-spacing:.3px;
}
.so-lieu{margin-left:auto; display:flex; gap:10px; flex-wrap:wrap}
.o-so{
  padding:7px 14px; border:1px solid var(--vien); border-radius:10px;
  background:rgba(16,42,67,.65); text-align:right; min-width:96px;
}
.o-so b{display:block;font-size:18px;color:var(--vang-sang);line-height:1.1}
.o-so span{font-size:10.5px;color:var(--chu-mo);text-transform:uppercase;letter-spacing:.7px}

/* ============ THANH CÔNG CỤ ============ */
.thanh-cong-cu{
  display:flex; flex-wrap:wrap; gap:12px; align-items:center;
  padding:12px 26px; border-bottom:1px solid rgba(30,63,92,.7);
  background:rgba(10,25,41,.55);
  position:sticky; top:71px; z-index:25; backdrop-filter:blur(8px);
}
.o-tim{position:relative;flex:1 1 260px;max-width:360px}
.o-tim input{
  width:100%; padding:9px 12px 9px 34px; border-radius:9px;
  border:1px solid var(--vien); background:rgba(16,42,67,.8);
  color:var(--kem); font-size:13.5px; outline:none;
  font-family:inherit;
}
.o-tim input::placeholder{color:var(--chu-rat-mo)}
.o-tim input:focus{border-color:var(--vang);box-shadow:0 0 0 3px rgba(200,148,37,.14)}
.o-tim .kinh{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--chu-rat-mo);font-size:13px}
.nut{
  padding:8px 14px;border-radius:9px;border:1px solid var(--vien);
  background:rgba(16,42,67,.7);color:var(--kem);font-size:12.5px;cursor:pointer;
  font-family:inherit; transition:.15s;
}
.nut:hover{border-color:var(--vang);color:var(--vang-sang)}
.chon{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--chu-mo);cursor:pointer;user-select:none}
.chon input{accent-color:var(--vang);width:15px;height:15px;cursor:pointer}
.ket-qua{margin-left:auto;font-size:12.5px;color:var(--chu-mo)}
.ket-qua b{color:var(--vang-sang)}

/* ============ KHUNG CÂY ============ */
.khung{overflow-x:auto;padding:34px 26px 60px}
.cay{display:flex;flex-direction:column;align-items:center;min-width:max-content;margin:0 auto}

.the-goc{
  position:relative;
  padding:16px 30px; border-radius:14px; text-align:center;
  background:linear-gradient(150deg,#1b4066,#0e2740);
  border:1px solid var(--vang);
  box-shadow:0 10px 34px rgba(0,0,0,.45), inset 0 1px 0 rgba(241,199,104,.22);
}
.the-goc .nhan{
  font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--vang);margin-bottom:5px
}
.the-goc h2{margin:0;font-size:19px;letter-spacing:.6px;color:var(--kem)}
.the-goc p{margin:6px 0 0;font-size:12px;color:var(--chu-mo)}

.hang-phong{
  display:flex;align-items:flex-start;justify-content:center;gap:20px;
  min-width:max-content;
}
.cot{position:relative;width:272px;flex:none;padding-top:34px}
.cot::before{
  content:"";position:absolute;top:0;left:-10px;right:-10px;height:2px;
  background:var(--duong-noi);
}
.cot:first-child::before{left:50%}
.cot:last-child::before{right:50%}
.cot:only-child::before{left:50%;right:50%}
.cot::after{
  content:"";position:absolute;top:0;left:50%;margin-left:-1px;width:2px;height:34px;
  background:var(--duong-noi);
}

.the-phong{
  position:relative;cursor:pointer;user-select:none;
  border:1px solid var(--vien);border-left:4px solid var(--mau,#c89425);
  border-radius:12px;padding:13px 14px;
  background:linear-gradient(160deg,rgba(23,52,80,.95),rgba(13,34,55,.95));
  box-shadow:0 6px 20px rgba(0,0,0,.35);
  transition:.18s;
}
.the-phong:hover{border-color:var(--vang);transform:translateY(-2px)}
.the-phong .dau{display:flex;align-items:center;gap:9px}
.the-phong .bieu-tuong{font-size:19px;line-height:1}
.the-phong .ten{font-size:13.5px;font-weight:700;letter-spacing:.2px;flex:1}
.the-phong .mui{font-size:11px;color:var(--chu-rat-mo);transition:transform .2s}
.cot.thu-gon .the-phong .mui{transform:rotate(-90deg)}
.the-phong .dong-so{
  display:flex;gap:8px;margin-top:9px;font-size:11px;color:var(--chu-mo);flex-wrap:wrap
}
.the-phong .vien-so{
  padding:2px 8px;border-radius:20px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.07)
}
.the-phong .vien-so.vang{color:var(--vang-sang);border-color:rgba(241,199,104,.3);background:rgba(200,148,37,.09)}

.noi-xuong{height:14px;position:relative}
.noi-xuong::before{content:"";position:absolute;left:26px;top:0;width:2px;height:14px;background:var(--duong-noi)}
.cot.thu-gon .noi-xuong{display:none}

.ds{position:relative;margin-left:26px;padding-left:20px;border-left:2px solid var(--duong-noi)}
.cot.thu-gon .ds{display:none}
.ds::after{content:"";position:absolute;left:-2px;bottom:0;width:2px;height:10px;background:var(--nen-1)}

.mau-ns{
  position:relative;display:flex;align-items:center;gap:9px;
  margin:7px 0;padding:7px 10px;border-radius:9px;
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);
  transition:.15s;
}
.mau-ns::before{
  content:"";position:absolute;left:-20px;top:50%;width:18px;height:2px;background:var(--duong-noi)
}
.mau-ns:hover{background:rgba(200,148,37,.1);border-color:rgba(241,199,104,.35);transform:translateX(2px)}
.mau-ns .tron{
  width:26px;height:26px;flex:none;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;letter-spacing:.2px;
  background:rgba(255,255,255,.07);color:var(--chu-mo);
  border:1px solid rgba(255,255,255,.09);
}
.mau-ns .khoi{min-width:0;flex:1;display:block}
.mau-ns .ten-ns{
  display:block;
  font-size:11.5px;line-height:1.35;color:var(--kem);
  overflow-wrap:anywhere;word-break:break-word;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
.mau-ns .vai{
  display:block;font-size:10px;color:var(--chu-rat-mo);margin-top:2px;
}

.mau-ns.truong{
  background:linear-gradient(120deg,rgba(200,148,37,.16),rgba(200,148,37,.05));
  border-color:rgba(241,199,104,.42);
  box-shadow:0 2px 12px rgba(200,148,37,.13);
}
.mau-ns.truong .tron{
  background:linear-gradient(145deg,var(--vang-sang),var(--vang));
  color:#0a1929;border-color:transparent;
}
.mau-ns.truong .ten-ns{color:#fff;font-weight:600}
.mau-ns.truong .vai{color:var(--vang-sang);font-weight:600}
.mau-ns.truong::before{background:var(--vang)}

.an{display:none !important}
.cot.khong-khop{opacity:.34}

.chan{
  padding:0 26px 40px;color:var(--chu-rat-mo);font-size:11.5px;text-align:center;
}
.chu-giai{
  display:flex;flex-wrap:wrap;gap:14px;justify-content:center;
  padding:6px 26px 26px;
}
.chu-giai span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--chu-mo)}
.chu-giai i{width:11px;height:11px;border-radius:3px;display:block}

@media (max-width:860px){
  .khung{padding:24px 14px 50px}
  .hang-phong{flex-direction:column;min-width:0;align-items:stretch;gap:8px}
  .cot{width:100%;padding-top:26px}
  .cot::before{left:50%;right:50%}
  .cot::after{height:26px}
  .cay{min-width:0;width:100%}
  .so-lieu{width:100%;margin-left:0}
  .thanh-cong-cu{top:auto;position:static}
  .thanh-tieu-de{position:static}
}
</style>
</head>

<header class="thanh-tieu-de">
  <div class="dau-hieu">ET</div>
  <div class="khoi-ten">
    <h1>Quản lý phòng ban AI</h1>
    <p>Mẫu 01 — Sơ đồ cây tổ chức</p>

  <div class="so-lieu">

  DU_LIEU.phong_ban.length + " phòng ban · " + DU_LIEU.tong + " nhân sự AI";

const hang = document.getElementById("hang");

DU_LIEU.phong_ban.forEach(pb => {
  const ds = theoPhong[pb.ma] || [];
  const soTruong = ds.filter(n => n.vai === "Trưởng phòng").length;
  const mau = MAU[pb.ma] || "#c89425";

  const cot = document.createElement("div");
  cot.className = "cot";
  cot.dataset.ma = pb.ma;
  cot.style.setProperty("--mau", mau);

  const the = document.createElement("div");
  the.className = "the-phong";
  the.innerHTML =
    '<div class="dau">' +
      '<span class="bieu-tuong">' + pb.icon + '</span>' +
      '<span class="ten">' + esc(pb.ten) + '</span>' +
      '<span class="mui">▼</span>' +
    '</div>' +
    '<div class="dong-so">' +
      '<span class="vien-so"><b class="dem">' + ds.length + '</b> nhân sự</span>' +
      '<span class="vien-so vang">' + soTruong + ' trưởng phòng</span>' +
    '</div>';
  the.addEventListener("click", () => cot.classList.toggle("thu-gon"));
  cot.appendChild(the);

  const noi = document.createElement("div");
  noi.className = "noi-xuong";
  cot.appendChild(noi);

  const khungDs = document.createElement("div");
  khungDs.className = "ds";
  ds.forEach(n => {
    const o = document.createElement("div");
    o.className = "mau-ns" + (n.vai === "Trưởng phòng" ? " truong" : "");
    o.dataset.ten = n.ten.toLowerCase();
    o.dataset.vai = n.vai.toLowerCase();
    o.dataset.truong = (n.vai === "Trưởng phòng") ? "1" : "0";
    o.innerHTML =
      '<span class="tron">' + esc(n.viet_tat) + '</span>' +
      '<span class="khoi">' +
        '<span class="ten-ns">' + esc(n.ten) + '</span>' +
        '<span class="vai">' + esc(n.vai) + '</span>' +
      '</span>';
    o.title = n.ten + " — " + n.vai + " · " + pb.ten;
    khungDs.appendChild(o);
  });
  cot.appendChild(khungDs);
  hang.appendChild(cot);
});

const chuGiai = document.getElementById("chu-giai");
DU_LIEU.phong_ban.forEach(pb => {
  const s = document.createElement("span");
  s.innerHTML = '<i style="background:' + (MAU[pb.ma]||"#c89425") + '"></i>' +
    pb.icon + " " + esc(pb.ten) + " (" + pb.so_nhan_su + ")";
  chuGiai.appendChild(s);
});

const oTim = document.getElementById("tim");
const oChiTruong = document.getElementById("chi-truong");
const oKetQua = document.getElementById("ket-qua");

function loc(){
  const tu = oTim.value.trim().toLowerCase();
  const chiTruong = oChiTruong.checked;
  let tongKhop = 0;

  document.querySelectorAll(".cot").forEach(cot => {
    let khop = 0;
    cot.querySelectorAll(".mau-ns").forEach(o => {
      const hopTu = !tu || o.dataset.ten.includes(tu) || o.dataset.vai.includes(tu);
      const hopVai = !chiTruong || o.dataset.truong === "1";
      const hien = hopTu && hopVai;
      o.classList.toggle("an", !hien);
      if(hien) khop++;
    });
    tongKhop += khop;
    cot.querySelector(".dem").textContent = khop;
    cot.classList.toggle("khong-khop", khop === 0);
    if(tu || chiTruong){
      cot.classList.toggle("thu-gon", khop === 0);
    }
  });

  oKetQua.innerHTML = (tu || chiTruong)
    ? 'Khớp <b>' + tongKhop + '</b> / ' + DU_LIEU.tong + ' nhân sự'
    : 'Đang hiển thị toàn bộ <b>' + DU_LIEU.tong + '</b> nhân sự';
}

oTim.addEventListener("input", loc);
oChiTruong.addEventListener("change", loc);
document.getElementById("nut-mo").addEventListener("click", () => {
  document.querySelectorAll(".cot").forEach(c => c.classList.remove("thu-gon"));
});
document.getElementById("nut-gon").addEventListener("click", () => {
  document.querySelectorAll(".cot").forEach(c => c.classList.add("thu-gon"));
});
loc();
</script>
</body>
</html>
