<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starting AIBOSS Office…</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0a1929;
      color: #faf7f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
    }
    .container {
      width: 100%;
      max-width: 480px;
      padding: 40px 32px;
      text-align: center;
      -webkit-app-region: no-drag;
    }
    .brand-icon {
      font-size: 48px;
      margin-bottom: 20px;
      display: inline-block;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.85; }
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: #ffffff;
    }
    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 28px;
    }
    .progress-bar-container {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 20px;
      position: relative;
    }
    .progress-bar-indicator {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 35%;
      background: linear-gradient(90deg, #c89425, #f59e0b);
      border-radius: 9999px;
      animation: indeterminate 1.5s cubic-bezier(0.65, 0.815, 0.735, 0.395) infinite;
    }
    @keyframes indeterminate {
      0% { left: -35%; width: 35%; }
      60% { left: 100%; width: 50%; }
      100% { left: 100%; width: 50%; }
    }
    .status-text {
      font-size: 13px;
      color: #cbd5e1;
      min-height: 20px;
    }
    .port-badge {
      display: inline-block;
      margin-top: 14px;
      padding: 4px 10px;
      background: rgba(200, 148, 37, 0.15);
      border: 1px solid rgba(200, 148, 37, 0.3);
      color: #f6d896;
      border-radius: 6px;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .error-box {
      display: none;
      margin-top: 24px;
      padding: 16px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      color: #fca5a5;
      font-size: 13px;
      text-align: left;
    }
    .retry-btn {
      display: none;
      margin-top: 20px;
      padding: 8px 20px;
      background: #c89425;
      color: #0a1929;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .retry-btn:hover {
      background: #dbaa38;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand-icon">⚡</div>
    <h1>Starting AIBOSS Office…</h1>
    <p class="subtitle">Autonomous AI Operations Workspace</p>

    <div class="progress-bar-container" id="progressBar">
      <div class="progress-bar-indicator"></div>
    </div>

    <div class="status-text" id="statusMessage">
      Connecting to background services…
    </div>

    <div class="port-badge" id="portBadge">
      Target: 127.0.0.1
    </div>

    <div class="error-box" id="errorBox"></div>
    <button class="retry-btn" id="retryBtn" onclick="window.location.reload()">Retry Connection</button>
  </div>

  <script>
    if (window.aibossDesktop && typeof window.aibossDesktop.getPort === 'function') {
      window.aibossDesktop.getPort().then(port => {
        const badge = document.getElementById('portBadge');
        if (badge) badge.textContent = 'Target: 127.0.0.1:' + port;
      }).catch(() => {});
    }
  </script>
</body>
</html>
